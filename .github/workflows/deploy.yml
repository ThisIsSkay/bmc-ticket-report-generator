name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - name: Configure GitHub Pages
        if: github.event_name != 'pull_request'
        uses: actions/configure-pages@v5
      - run: npm ci
      - run: npm test
      - run: npm run typecheck
      - run: npm run build:gh-pages
      # Keep the NCC screenshot dashboard on main while publishing a separate
      # testable email prototype from its feature branch at /daily-email/.
      - name: Checkout Daily Pivot & Email Report working branch
        uses: actions/checkout@v5
        with:
          ref: feature/daily-pivot-email-report
          path: .email-preview-source
          persist-credentials: false
      - name: Test and stage Daily Pivot & Email Report preview
        run: |
          node --test .email-preview-source/prototype/daily-email/test/report.test.mjs
          mkdir -p dist/daily-email
          cp -R .email-preview-source/prototype/daily-email/. dist/daily-email/
          rm -f dist/daily-email/.gitignore dist/daily-email/README.md dist/daily-email/server.mjs dist/daily-email/package.json
          rm -rf dist/daily-email/test
      - uses: actions/upload-pages-artifact@v3
        if: github.event_name != 'pull_request'
        with:
          path: dist
  deploy:
    # Pull requests only validate; Pages deploys exclusively from a push to
    # main (or a manual dispatch run on main).
    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
