name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  # Pull-request validation runs get their own group so they can never
  # cancel an in-progress production Pages deploy.
  group: pages-${{ github.event_name == 'pull_request' && github.ref || 'deploy' }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - name: Configure GitHub Pages
        if: github.event_name != 'pull_request'
        uses: actions/configure-pages@v5
      - run: npm ci
      - run: npm test
      - run: npm run test:survey
      - run: npm run test:email
      - run: npm run typecheck
      # Proves every report output still matches the recorded Phase 0 goldens.
      # The image group needs a pinned browser and fonts, so CI checks the
      # data, email, storage and survey outputs (docs/merge/BASELINE.md).
      - run: npm run golden:check -- --skip-visual
      - run: npm run build:gh-pages
      # One checkout publishes every page: the WhatsApp report at the root, the
      # unified app at /app/, and the two prototypes at /daily-email/ and
      # /customer-survey/. No other branch is fetched at build time.
      - name: Stage the email and survey pages
        run: node scripts/stage-pages.mjs
      - uses: actions/upload-pages-artifact@v3
        if: github.event_name != 'pull_request'
        with:
          path: dist
  deploy:
    # Pull requests only validate; Pages deploys exclusively from a push to
    # main (or a manual dispatch run on main).
    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
