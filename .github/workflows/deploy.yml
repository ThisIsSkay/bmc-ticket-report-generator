name: Deploy to GitHub Pages

on:
  push:
    branches: [main, feature/daily-pivot-email-report]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - name: Configure GitHub Pages
        if: github.event_name != 'pull_request'
        uses: actions/configure-pages@v5
      - run: npm ci
      - run: npx vitest run src/test
      - name: Test standalone email prototype
        if: github.ref == 'refs/heads/feature/daily-pivot-email-report'
        run: npm --prefix prototype/daily-email test
      - run: npm run typecheck
      - run: npm run build:gh-pages
      - name: Include standalone email prototype for branch preview
        if: github.ref == 'refs/heads/feature/daily-pivot-email-report'
        run: |
          mkdir -p dist/daily-email
          cp prototype/daily-email/index.html prototype/daily-email/app.mjs prototype/daily-email/style.css dist/daily-email/
          cp -R prototype/daily-email/lib prototype/daily-email/samples dist/daily-email/
      - uses: actions/upload-pages-artifact@v3
        if: github.event_name != 'pull_request'
        with:
          path: dist
  deploy:
    # Pull requests validate only. Feature branch deploys the same NCC app plus the standalone preview.
    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/feature/daily-pivot-email-report')
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
